[project]
name = "cancer-immunology-reasoner"
version = "0.1.0"
description = "A system for causal reasoning in cancer immunology"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "openai>=1.0",
    "numpy>=1.24",
    "faiss-cpu>=1.7",
    "pdfplumber>=0.10",
    "typer>=0.9",
    "rich>=13.0",
    "networkx>=3.0",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "ujson>=5.0",
    "requests>=2.31",
]

[tool.ruff]
line-length = 100
target-version = "py311"